+'<div class="row" style="margin:8px 0">'+(i<5?'<button class="p" onclick="advance(\''+s.id+'\')">Move to: '+LIFE[i+1]+'</button>':'')+(!dn?'<button onclick="delay(\''+s.id+'\')">'+(s.dl?'Clear delay':'Mark delayed')+'</button>':'')+'</div>'
+'<label>Fuel record (quantity; unit per approved procedure)</label><div class="row"><input style="width:120px;margin:0" id="fq'+s.id+'" type="number" min="1"><select style="width:100px;margin:0" id="fu'+s.id+'"><option>litres</option><option>kg</option></select><button onclick="fuel(\''+s.id+'\')">Save fuel record</button></div>'+(s.fuel.map(x=>'<div class="tl">'+x+'</div>').join('')||'<div class="tl">No fuel record yet.</div>')
+'<label>Operational / delay notes</label><textarea id="nt'+s.id+'" rows="2">'+X(s.notes)+'</textarea><button onclick="saveNote(\''+s.id+'\')">Save notes</button></div>'}).join('')+(W.length?'<div class="card"><h3>Awaiting a pilot</h3>'+W.map(s=>s.id+' · '+s.f+'→'+s.t+' · '+fd(s.d)).join('<br>')+'<br><br><button onclick="go(\'crew\')">Go to Pilots</button></div>':'')}
if(v=='inv'){const R=S.bk.filter(b=>b.st=='Confirmed'||b.st=='Completed');m+='<h1>Invoices <small style="font-size:13px;color:var(--sl)">(Accounts users only)</small></h1><div class="note">Three separate steps: booking confirmation, invoice, and manual payment record. Nothing is charged by this platform.</div>'+(S.err?'<div class="err">'+S.err+'</div>':'')+'<div class="card tw"><table><tr><th>Booking</th><th>Customer</th><th>Trip</th><th>Date</th><th>Trip status</th><th>Invoice</th><th>Payment</th><th></th></tr>'+R.map(b=>{const s=sl(b.s),v=S.inv[b.id];return '<tr><td>'+b.id+'</td><td>'+X(b.cn)+'</td><td>'+s.f+' → '+s.t+'</td><td>'+fd(s.d)+'</td><td>'+bd(s.ops)+'</td><td>'+(v?bd(invSt(v)):'Not started')+'</td><td>'+(v&&v.st=='Issued'?bd(v.pay=='Paid'?'Completed':'Pending').replace(/>(Completed|Pending)</,'>'+v.pay+' (manual)<'):'—')+'</td><td><button onclick="'+(v?'showInv':'mkInv')+'(\''+b.id+'\')">'+(v?'View invoice':'Create draft')+'</button></td></tr>'}).join('')+'</table></div>'}
if(v=='cus'){const C={};S.bk.forEach(b=>{(C[b.c]=C[b.c]||{n:b.cn,k:[]}).k.push(b)});m+='<h1>Customers</h1><div class="card tw"><table><tr><th>Ref</th><th>Name</th><th>Bookings</th><th>Latest trip</th><th>Record</th></tr>'+Object.keys(C).map(k=>{const c=C[k],d=c.k.filter(b=>b.st=='Completed').map(b=>sl(b.s).d).sort().pop();return '<tr><td>'+k+'</td><td>'+c.n+'</td><td>'+c.k.length+'</td><td>'+(d?fd(d):'—')+'</td><td><span class="badge b-Confirmed">Active</span></td></tr>'}).join('')+'</table></div><div class="note">Contact details are visible only on a customer record, to authorised staff.</div>'}
if(v=='air'){const n=nx(),up=S.slots.filter(s=>live(s)&&s.d>='2026-10-24'),all=S.slots.filter(live),done=all.filter(s=>s.ops=='Completed'),A=S.air;m+='<h1>Aircraft</h1><div class="card"><div class="two"><div><svg viewBox="0 0 220 70" width="200" role="img" aria-label="Aircraft silhouette"><path d="M10 38 L150 34 Q205 32 212 38 Q205 44 150 42 L10 42Z" fill="#183A56"/><path d="M95 36 L128 6 L140 6 L122 36Z M95 40 L128 70 L140 70 L122 40Z" fill="#B99A5B"/><path d="M12 38 L22 18 L30 18 L28 38Z" fill="#101C2C"/></svg><h3>SKYVAULT Jet 1 <small>(demo name)</small></h3>Registration: To be configured by administrator<br>Type: To be configured by administrator<br>Range and performance: not supplied<br>Maximum passengers: <b>8</b></div><div><label for="as_">Operational status</label><select id="as_" onchange="S.air.status=this.value;log(\'Aircraft status set to \'+this.value);render()">'+['In service','Preparation in progress','Under maintenance','Unavailable'].map(o=>'<option '+(o==A.status?'selected':'')+'>'+o+'</option>').join('')+'</select><span class="badge '+(A.status=='In service'?'b-Confirmed':'b-Pending')+'">'+A.status+'</span><br><br>Next flight: '+n.id+' · '+n.f+' → '+n.t+'<br>'+fd(n.d)+' · '+n.dep+' IST<br>Pilot: '+pn(n.pilot)+'</div></div></div>'
+'<div class="grid"><div class="card kpi"><b>'+done.length+'</b>Flights completed</div><div class="card kpi"><b>'+done.reduce((a,s)=>a+dur(s),0).toFixed(1)+'</b>Scheduled hours flown</div><div class="card kpi"><b>'+up.length+'</b>Upcoming flights</div><div class="card kpi"><b>'+S.slots.filter(s=>s.st=='cancelled').length+'</b>Cancelled slots</div></div>'
+'<div class="card tw"><h3>Aircraft schedule</h3><table><tr><th>Slot</th><th>Route</th><th>Date</th><th>Time</th><th>Pilot</th><th>Seats</th><th>Status</th></tr>'+S.slots.map(s=>'<tr><td>'+s.id+'</td><td>'+s.f+' → '+s.t+'</td><td>'+fd(s.d)+'</td><td>'+s.dep+'–'+s.arr+'</td><td>'+pn(s.pilot)+'</td><td>'+bar(used(s.id))+' '+used(s.id)+'/8</td><td>'+bd(s.st=='cancelled'?'Cancelled':s.ops)+'</td></tr>').join('')+'</table></div>'
+'<div class="card"><h3>Document and maintenance reminders <small>(proposed feature, not active)</small></h3>'+['Insurance document','Scheduled inspection','Crew document review'].map(t=>'<div class="row" style="justify-content:space-between;padding:4px 0"><span>'+t+'</span><span style="color:var(--sl)">Date to be entered by administrator</span></div>').join('')+'</div>'}
if(v=='log'){const ks=['All','Bookings','Schedule','Pilots','Operations','Invoices'],L=S.log.filter(x=>(S.lf=='All'||x.k==S.lf)&&(x.m+x.a).toLowerCase().includes(S.lq.toLowerCase()));m+='<h1>Activity log</h1><div class="row"><input id="lq" style="width:220px;margin:0" placeholder="Search activity" value="'+X(S.lq)+'" oninput="S.lq=this.value;render();$(\'lq\').focus()">'+ks.map(k=>'<button class="'+(S.lf==k?'p':'')+'" onclick="S.lf=\''+k+'\';render()">'+k+'</button>').join('')+'</div><div class="card tw" style="margin-top:12px"><table><tr><th>When (IST)</th><th>Who</th><th>Area</th><th>What happened</th></tr>'+(L.map(x=>'<tr><td>'+x.t+'</td><td>'+x.a+'</td><td>'+x.k+'</td><td style="white-space:normal">'+X(x.m)+'</td></tr>').join('')||'<tr><td colspan="4">No activity matches.</td></tr>')+'</table></div><div class="note">'+L.length+' of '+S.log.length+' entries shown. Simulated; production audit logging needs a backend.</div>'}
return '<div class="adm"><nav class="side" aria-label="Admin">'+NAV.map(x=>'<button class="'+(v==x[0]?'on':'')+'" onclick="S.av=\''+x[0]+'\';S.err=\'\';S.sel=null;S.note=\'\';render()">'+x[1]+'</button>').join('')+'</nav><main class="main">'+m+'</main></div>'}
function act(a){const b=bkOf(S.sel),s=sl(b.s);
if(a=='ok'){if(b.n>left(s.id)){S.note='';ask('Approval blocked: '+b.n+' passengers exceed the '+left(s.id)+' free seats on '+s.id+'.',()=>{});return}
ask('Approve '+b.id+'?',()=>{b.st='Confirmed';b.h.push('Approved by Booking Admin');log(b.id+' approved');S.note='Demo notification preview (not sent): "Your booking '+b.id+' is confirmed."';render()})}
if(a=='no')ask('Reject '+b.id+'?',r=>{b.st='Rejected';b.h.push('Rejected: '+r);log(b.id+' rejected — '+r);render()},1);
if(a=='info')ask('Ask the passenger for more information?',r=>{b.st='Info Required';b.h.push('Information requested: '+r);log(b.id+' info requested');render()},1)}
function addSlot(){const s={id:'FS-'+String(S.slots.length+1).padStart(2,'0'),f:$('nf').value.toUpperCase(),t:$('nt').value.toUpperCase(),d:$('nd').value,dep:$('ndp').value,arr:$('nar').value,st:'draft',pilot:'',ops:'Scheduled',fuel:[],notes:''};
if(!s.f||!s.t||!s.d||!s.dep||!s.arr||T(s.d,s.arr)<=T(s.d,s.dep)){S.err='Fill all fields; arrival must be after departure.';render();return}S.err='';S.slots.push(s);log(s.id+' created as draft');render()}
function publish(id){const s=sl(id),cf=conflicts(s);if(cf.length){ask('Cannot publish: '+id+' overlaps '+cf.map(x=>x.id).join(', ')+' (incl. '+BUF+' min buffer). Change the time or cancel the other slot.',()=>{});return}s.st='available';log(id+' published');render()}
function cancelSlot(id){ask('Cancel slot '+id+'? Linked bookings will be marked Cancelled.',()=>{const s=sl(id);s.st='cancelled';S.bk.filter(b=>b.s==id&&!['Rejected','Completed'].includes(b.st)).forEach(b=>{b.st='Cancelled';b.h.push('Slot cancelled by Operations')});log(id+' cancelled');render()})}
function assign(sid,pid){const s=sl(sid),c=pconf(s,pid);if(c.length){S.err=pn(pid)+' already has an overlapping assignment ('+c.map(x=>x.id).join(', ')+'). Choose another pilot or resolve first.';render();return}S.err='';s.pilot=pid;log(sid+': '+pn(pid)+' assigned by Operations Manager');render()}
function advance(id){const s=sl(id),n=LIFE[LIFE.indexOf(s.ops)+1];s.ops=n;if(n=='Departed')s.ad=nowT();if(n=='Arrived')s.aa=nowT();log(id+' status → '+n);if(n=='Completed')S.bk.filter(b=>b.s==id&&b.st=='Confirmed').forEach(b=>{b.st='Completed';b.h.push('Trip completed')});render()}
function delay(id){const s=sl(id);s.dl=!s.dl;log(id+(s.dl?' marked Delayed':' delay cleared'));render()}
function fuel(id){const q=$('fq'+id).value;if(!(q>0)){toast('Enter a fuel quantity above 0');return}sl(id).fuel.push(q+' '+$('fu'+id).value+' · '+new Date().toLocaleTimeString('en-IN')+' IST · entered by Operations Manager');log(id+' fuel record added');render()}
const dur=s=>(T(s.d,s.arr)-T(s.d,s.dep))/36e5,bar=u=>'<span style="display:inline-block;vertical-align:middle;background:#e8ebf0;border-radius:4px;height:8px;width:80px"><span style="display:block;background:var(--gold);height:8px;border-radius:4px;width:'+u/8*100+'%"></span></span>',nowT=()=>new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})+' IST',ck=s=>s.chk=s.chk||(s.ops=='Completed'?[1,1,1,1]:[0,0,0,0]);
const invSt=v=>v.st=='Issued'?'Issued':(+v.amt>0?'Draft':'Draft — Amounts Pending');
function unassign(id){sl(id).pilot='';log(id+': pilot assignment removed');render()}
function saveNote(id){sl(id).notes=$('nt'+id).value;log(id+': operational notes updated');toast('Notes saved')}
function mkInv(bid){const b=bkOf(bid),s=sl(b.s);if(b.st!='Completed'||s.ops!='Completed'){S.err='Not eligible: '+bid+' is not a completed trip. Complete the flight in Flight operations first.';render();return}S.err='';S.inv[bid]=S.inv[bid]||{id:'DRAFT-'+bid,b:bid,amt:'',tax:'',st:'Draft',pay:'Unpaid'};log('Draft invoice created for '+bid);render();showInv(bid)}
function showInv(bid){const v=S.inv[bid],b=bkOf(bid),s=sl(b.s),is=v.st=='Issued';$('ov').innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="Invoice preview" style="align-items:flex-start;overflow:auto"><div class="card" style="max-width:640px"><div class="row noprint" style="justify-content:space-between"><b>Invoice preview <span class="badge b-Pending">Demo</span></b><button onclick="$(\'ov\').innerHTML=\'\';render()">Close</button></div>'
+'<div style="border-bottom:3px solid var(--gold);padding:10px 0;display:flex;justify-content:space-between"><div><b style="font-family:Georgia;font-size:20px;letter-spacing:.1em">SKY<span style="color:var(--gold)">VAULT</span></b><div style="font-size:12px;color:var(--sl)">[Company name, address and GSTIN to be supplied]</div></div><div style="text-align:right"><b>'+(is?'INVOICE':'DRAFT INVOICE')+'</b><br><span id="ist">'+invSt(v)+'</span></div></div>'
+'<div class="two" style="margin:12px 0"><div><small>Billed to</small><br><b>'+X(b.cn)+'</b><br>'+b.c+'</div><div><small>Invoice no.</small> '+(is?v.no:v.id+' (format to be confirmed)')+'<br><small>Date</small> '+fd('2026-10-24')+'<br><small>Booking</small> '+b.id+'</div></div>'
+'<table><tr><th>Description</th><th>Trip date</th><th style="text-align:right">Amount (₹)</th></tr><tr><td style="white-space:normal">Private charter flight '+s.f+' → '+s.t+'<br><small>Passengers: '+b.n+' · '+X(b.names)+'</small></td><td>'+fd(s.d)+'</td><td style="text-align:right"><input type="number" min="0" '+(is?'disabled ':'')+'style="width:120px;margin:0;text-align:right" value="'+X(v.amt)+'" placeholder="Enter amount" oninput="setInv(\''+bid+'\',\'amt\',this.value)"></td></tr><tr><td colspan="2">Tax amount (treatment to be confirmed)</td><td style="text-align:right"><input type="number" min="0" '+(is?'disabled ':'')+'style="width:120px;margin:0;text-align:right" value="'+X(v.tax)+'" placeholder="Enter tax" oninput="setInv(\''+bid+'\',\'tax\',this.value)"></td></tr><tr><td colspan="2"><b>Total</b></td><td style="text-align:right"><b id="itot">'+invTot(v)+'</b></td></tr></table>'
+'<p style="font-size:13px">Payment to be handled manually. Payment status: <b id="ipay">'+v.pay+(v.pay=='Paid'?' on '+v.pd:'')+'</b></p><div id="ierr" class="err" hidden></div>'
+'<div class="row noprint">'+(is?'':'<button onclick="document.querySelectorAll(\'.modal input[type=number]\')[0].value=50000;setInv(\''+bid+'\',\'amt\',50000)">Fill sample amount (demo only)</button><button class="g" onclick="issueInv(\''+bid+'\')">Mark as issued</button>')+(is&&v.pay!='Paid'?'<button class="p" onclick="payInv(\''+bid+'\')">Record manual payment</button>':'')+'<button class="p" onclick="window.print()">Print / save as PDF</button></div></div></div>'}
function invTot(v){const t=(+v.amt||0)+(+v.tax||0);return t?'₹'+t.toLocaleString('en-IN'):'Amounts pending'}
function setInv(bid,k,x){const v=S.inv[bid];v[k]=x;$('itot').textContent=invTot(v);$('ist').textContent=invSt(v)}
function issueInv(bid){const v=S.inv[bid];if(!(+v.amt>0)){$('ierr').hidden=false;$('ierr').textContent='Enter the service amount before issuing. An invoice with pending amounts cannot be issued.';return}v.st='Issued';v.no='INV-'+bid.slice(-3)+' (numbering to be confirmed)';log('Invoice issued for '+bid);showInv(bid)}
function payInv(bid){const v=S.inv[bid];v.pay='Paid';v.pd=fd('2026-10-24');log('Manual payment recorded for '+bid+' invoice');showInv(bid)}
init();render();
</script></body></html>
